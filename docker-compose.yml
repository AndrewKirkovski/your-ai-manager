services:
  bot:
    image: ghcr.io/andrewkirkovski/your-ai-manager:latest
    container_name: ai-manager-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LUXMED_SIDECAR_URL: "http://luxmed-sidecar:8080"
      LUXMED_SIDECAR_SECRET: "${LUXMED_SIDECAR_SECRET:?set LUXMED_SIDECAR_SECRET in .env — no default allowed}"
      # Pin Node's process timezone so cron, luxon, log timestamps, and routine
      # parsing all agree on a single wall clock. Override in .env if needed —
      # per-user TZ is not planned. Defaults to Europe/Warsaw.
      TZ: "${TZ:-Europe/Warsaw}"
    ports:
      - "3000:3000"
    volumes:
      - bot-data:/app/data
    depends_on:
      luxmed-sidecar:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  luxmed-sidecar:
    image: ghcr.io/andrewkirkovski/your-ai-manager-luxmed-sidecar:latest
    container_name: luxmed-sidecar
    restart: unless-stopped
    environment:
      DB_HOST: luxmed-db
      DB_PORT: 5432
      DB_USER: "${LUXMED_DB_USER:-lbs}"
      DB_PASSWORD: "${LUXMED_DB_PASSWORD:?set LUXMED_DB_PASSWORD in .env — no default allowed}"
      DB_NAME: "${LUXMED_DB_NAME:-lbs}"
      REST_SECRET: "${LUXMED_SIDECAR_SECRET:?set LUXMED_SIDECAR_SECRET in .env — no default allowed}"
      TELEGRAM_ENABLED: "false"
      SERVER_PORT: 8080
      # Fail-closed: compose refuses to start if LUXMED_SECURITY_SECRET is unset
      # (the `:?` expansion aborts with the message).
      SECURITY_SECRET: "${LUXMED_SECURITY_SECRET:?set LUXMED_SECURITY_SECRET in .env — no default allowed}"
      # Webhook secret embedded in URL — sidecar can't add custom headers, so
      # the bot also accepts ?secret= as fallback. Fail-closed: compose refuses
      # to start if LUXMED_WEBHOOK_SECRET is unset.
      MONITORING_WEBHOOK_URL: "http://bot:3000/api/luxmed/monitoring-callback?secret=${LUXMED_WEBHOOK_SECRET:?set LUXMED_WEBHOOK_SECRET in .env — no default allowed}"
    depends_on:
      luxmed-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080"]
      interval: 10s
      timeout: 3s
      retries: 12
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  luxmed-db:
    image: postgres:16
    container_name: luxmed-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${LUXMED_DB_USER:-lbs}"
      POSTGRES_PASSWORD: "${LUXMED_DB_PASSWORD:?set LUXMED_DB_PASSWORD in .env — no default allowed}"
      POSTGRES_DB: "${LUXMED_DB_NAME:-lbs}"
      TZ: Europe/Warsaw
    volumes:
      - luxmed-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_LABEL_ENABLE=true
    command: --interval 300

volumes:
  bot-data:
  luxmed-postgres:
