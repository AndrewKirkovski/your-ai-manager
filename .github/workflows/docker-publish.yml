name: Build and Push Docker Images

on:
  push:
    branches: [main, codex/luxmed-unattended-update]
  workflow_dispatch:

# Serialize publication so separate runs cannot mix latest images.
concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BOT_IMAGE: ghcr.io/andrewkirkovski/your-ai-manager
  SIDECAR_IMAGE: ghcr.io/andrewkirkovski/your-ai-manager-luxmed-sidecar

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile --production=false

      - name: Typecheck bot
        run: yarn typecheck

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build and test sidecar
        working-directory: luxmed-bot
        run: |
          chmod +x gradlew
          ./gradlew checkScalafmtAll :api:test :bot:test :common:test :server:test :server:build --no-daemon

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build bot candidate
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: luxmed-bot:test
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Build sidecar candidate
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.luxmed-prod
          load: true
          tags: luxmed-sidecar:test
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Rehearse unattended upgrade from deployed configuration
        env:
          LEGACY_SIDECAR_IMAGE: ghcr.io/andrewkirkovski/your-ai-manager-luxmed-sidecar:71d61a0
          LEGACY_BOT_IMAGE: ghcr.io/andrewkirkovski/your-ai-manager:71d61a0
        run: python3 tests/luxmed-image-upgrade.py

      - name: Publish tested images
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists; skipping superseded publication."
            exit 0
          fi
          # Push both immutable references before advancing the watched tags.
          for pair in "luxmed-bot:test $BOT_IMAGE" "luxmed-sidecar:test $SIDECAR_IMAGE"; do
            read -r local_image remote_image <<< "$pair"
            docker tag "$local_image" "$remote_image:$GITHUB_SHA"
            docker push "$remote_image:$GITHUB_SHA"
          done
          docker tag luxmed-sidecar:test "$SIDECAR_IMAGE:latest"
          docker push "$SIDECAR_IMAGE:latest"
          docker tag luxmed-bot:test "$BOT_IMAGE:latest"
          docker push "$BOT_IMAGE:latest"
          {
            echo "Published bot and sidecar for $GITHUB_SHA after upgrade verification."
            echo "Watchtower rehearsal preserved PG10, stored credentials and existing environment."
          } >> "$GITHUB_STEP_SUMMARY"
